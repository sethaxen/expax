[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expax"
version = "0.1.0"
description = "Matrix-exponential actions in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "Seth D. Axen" },
]
dependencies = [
    "jax>=0.4.38",
    "jaxtyping",
    "matfree>=0.6,<0.7",
]

[dependency-groups]
test = [
    { include-group = "theta" },
    "pytest>=8,<10",
]
lint = [
    "prek>=0.3",
    "ruff>=0.11",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx>=8",
    "sphinx-autodoc2",
]
theta = [
    "ml-dtypes>=0.5",
    "mpmath>=1.3",
    "scipy>=1.12",
    "sympy>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/expax"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = ["F722"]
select = ["B", "E", "F", "I", "RUF", "UP"]
