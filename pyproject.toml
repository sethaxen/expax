[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expax"
version = "0.1.0"
description = "Matrix-exponential actions in JAX"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "Seth D. Axen" },
]
dependencies = [
    "jax>=0.4.38",
    "matfree>=0.6,<0.7",
]

[dependency-groups]
test = [
    "pytest>=8,<10",
    "scipy>=1.12",
]
lint = [
    "ruff>=0.11",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/expax"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
